<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flubber practice page</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{background:#faf9f6;color:#1a2a40;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0}main{max-width:650px;padding:48px 24px;margin:auto}h1{font-size:30px;letter-spacing:-1px;margin:0 0 10px}p{color:#626d7b}form{margin-top:30px;padding:26px;background:white;border:1px solid #e5e5e0;border-radius:14px}label{display:block;margin:18px 0 7px}input[type=text],select{font:inherit;padding:10px;border:1px solid #bec5ce;border-radius:7px;width:100%;box-sizing:border-box}button{font:inherit;padding:11px 17px;border:0;border-radius:8px;background:#185bcd;color:white;margin-top:20px}.check{display:flex;gap:10px;align-items:center}#result{margin-top:26px;background:#e8f2eb;padding:20px;border-radius:10px}#result[hidden]{display:none}.aside{font-size:13px}</style></head>
<body><main><h1>A place to try Flubber.</h1><p>This practice page saves nothing and sends no form data. Use it for your first browser task.</p><p class="aside">Try: “Enter Vishwa as the name, choose Weekly, enable reminders, and save.”</p>
<form id="practice-form"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="off"><label for="frequency">Update frequency</label><select id="frequency" name="frequency"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select><label class="check"><input id="reminders" type="checkbox">Enable reminders</label><button id="save" type="submit">Save preferences</button></form><div id="result" role="status" hidden></div></main><script src="/test/fixture.js"></script></body></html>
